<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لایو ویس‌چت</title>
  <script src="https://meet.jit.si/external_api.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .top-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      width: min(900px, 100%);
    }
    input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
      font-size: 14px;
    }
    button {
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      background: #2563eb;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    #meet {
      width: min(900px, 100%);
      height: 75vh;
      border-radius: 12px;
      overflow: hidden;
      background: #1e293b;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <input id="roomName" placeholder="نام اتاق صوتی (مثلاً: game-room-1)" value="my-chat-room">
    <button onclick="joinVoice()">ورود به ویس</button>
  </div>

  <div id="meet"></div>

  <script>
    let api = null;

    function joinVoice() {
      const room = document.getElementById("roomName").value.trim();
      if (!room) return alert("نام اتاق را وارد کن");

      if (api) api.dispose();

      const domain = "meet.jit.si";
      const options = {
        roomName: "pchat-" + room,
        width: "100%",
        height: "100%",
        parentNode: document.querySelector('#meet'),
        configOverwrite: {
          startWithAudioMuted: false,
          startWithVideoMuted: true, // فقط ویس، تصویر خاموش
          prejoinPageEnabled: false
        },
        interfaceConfigOverwrite: {
          TOOLBAR_BUTTONS: ['microphone', 'hangup', 'tileview']
        }
      };

      api = new JitsiMeetExternalAPI(domain, options);
    }
  </script>
</body>
</html>
